{% extends 'layouts/main.html' %}

{% block breadcrumbs %}
<ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item"><a href="/">Início</a></li>
    <li class="breadcrumb-item"><a href="/produto/lista">Lista de produtos</a></li>
    <li class="breadcrumb-item active" aria-current="page">Detalhes do produto</li>
</ol>
{% endblock %}

{% block main %}
<form id="form">
    <input type="hidden" id="action" name="action" value="{{ action }}">
    <input type="hidden" id="id"     name="id"     value="{{ id }}">

    <div class="row">
        <div class="col-12">
            <div class="card">

                <div class="card-header">
                    <a href="/produto/lista" class="btn btn-warning">
                        <i class="fa-solid fa-chevron-left"></i>
                        Voltar
                    </a>
                </div>

                <div class="card-body">
                    <div class="row">

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="nome" name="nome"
                                    placeholder="Digite o nome do produto!"
                                    value="{{ product.nome }}" required>
                                <label for="nome">Digite o nome do produto!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="codigoBarra" name="codigoBarra"
                                    placeholder="Digite o código de barras!"
                                    value="{{ product.codigo_barra }}">
                                <label for="codigoBarra">Digite o código de barras!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="grupo" name="grupo"
                                    placeholder="Digite o grupo!"
                                    value="{{ product.grupo }}">
                                <label for="grupo">Digite o grupo!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    id="unidade" name="unidade"
                                    placeholder="Digite a unidade!"
                                    value="{{ product.unidade }}">
                                <label for="unidade">Digite a unidade!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="precoCompra" name="precoCompra"
                                    placeholder="Preço de compra!"
                                    value="{{ product.preco_compra }}">
                                <label for="precoCompra">Preço de compra!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="totalImposto" name="totalImposto"
                                    placeholder="Total de impostos!"
                                    value="{{ product.total_imposto }}">
                                <label for="totalImposto">Total de impostos!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="margemLucro" name="margemLucro"
                                    placeholder="Margem de lucro!"
                                    value="{{ product.margem_lucro }}">
                                <label for="margemLucro">Margem de lucro!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="custoOperacional" name="custoOperacional"
                                    placeholder="Custo operacional!"
                                    value="{{ product.custo_operacional }}">
                                <label for="custoOperacional">Custo operacional!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="valorVendaSugerido" name="valorVendaSugerido"
                                    placeholder="Valor de venda sugerido!"
                                    value="{{ product.valor_venda_sugerido }}">
                                <label for="valorVendaSugerido">Valor de venda sugerido!</label>
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="number" step="0.0001" class="form-control"
                                    id="precoVenda" name="precoVenda"
                                    placeholder="Preço de venda!"
                                    value="{{ product.preco_venda }}">
                                <label for="precoVenda">Preço de venda!</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating mb-3">
                                <textarea class="form-control"
                                    id="descricao" name="descricao"
                                    placeholder="Descrição do produto!"
                                    style="height: 100px">{{ product.descricao }}</textarea>
                                <label for="descricao">Descrição do produto!</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="icheck-primary d-inline">
                                <input class="form-check-label" type="checkbox"
                                    id="ativo" name="ativo" value="true"
                                    {% if product.ativo == 1 %} checked {% endif %}>
                                <label for="ativo">Ativo?</label>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="card-footer">
                    <button id="insert" type="button" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Salvar
                    </button>
                </div>

            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block script %}
{{ vite('resources/js/pages/product.js') }}
{% endblock %}
